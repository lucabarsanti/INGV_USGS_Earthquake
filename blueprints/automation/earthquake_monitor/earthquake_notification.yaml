blueprint:
  name: Earthquake notification (INGV + USGS) / Notifica terremoto
  description: >-
    Send a notification when the Earthquake Monitor integration detects a new
    earthquake within a chosen distance and above a chosen magnitude.
    ---
    Invia una notifica quando l'integrazione Earthquake Monitor rileva un nuovo
    terremoto entro una distanza e sopra una magnitudo scelte.
  domain: automation
  source_url: https://github.com/lucabarsanti/INGV_USGS_Earthquake/blob/main/blueprints/automation/earthquake_monitor/earthquake_notification.yaml
  input:
    max_distance:
      name: Maximum distance / Distanza massima (km)
      description: Notify only for earthquakes closer than this.
      default: 100
      selector:
        number:
          min: 1
          max: 20000
          step: 1
          unit_of_measurement: km
          mode: box
    min_magnitude:
      name: Minimum magnitude / Magnitudo minima
      description: Notify only for earthquakes at least this strong.
      default: 3.0
      selector:
        number:
          min: 0
          max: 9
          step: 0.1
          mode: box
    notify_device:
      name: Device to notify / Dispositivo da notificare
      description: Device running the Home Assistant Companion app.
      selector:
        device:
          integration: mobile_app
    critical:
      name: Critical notification / Notifica critica
      description: Deliver as a critical alert (bypasses silent mode on iOS/Android).
      default: false
      selector:
        boolean:

mode: parallel
max: 10

trigger:
  - platform: event
    event_type: earthquake_monitor_quake

variables:
  max_distance: !input max_distance
  min_magnitude: !input min_magnitude
  critical: !input critical
  notify_device: !input notify_device
  quake_distance: "{{ trigger.event.data.distance_km | float(9e9) }}"
  quake_magnitude: "{{ trigger.event.data.magnitude | float(0) }}"

condition:
  - condition: template
    value_template: >-
      {{ quake_distance <= max_distance | float
         and quake_magnitude >= min_magnitude | float }}

action:
  - service: >-
      notify.mobile_app_{{ device_attr(notify_device, "name") | slugify }}
    data:
      title: >-
        🌍 Earthquake M {{ '%.1f' | format(quake_magnitude) }}
      message: >-
        {{ trigger.event.data.place }} —
        {{ '%.0f' | format(quake_distance) }} km away, depth
        {{ trigger.event.data.depth_km | round(0) }} km
        ({{ trigger.event.data.source | upper }}).
      data: >-
        {% set base = {
          "url": trigger.event.data.url,
          "clickAction": trigger.event.data.url,
          "tag": trigger.event.data.id
        } %}
        {% if critical %}
          {{ dict(base, push={"sound": {"name": "default", "critical": 1, "volume": 1.0}}, ttl=0, priority="high", channel="alarm_stream") }}
        {% else %}
          {{ base }}
        {% endif %}
