name: Feature request / Richiesta funzionalità
description: Suggest an idea for the integration or the map card.
labels: ["enhancement"]
body:
  - type: textarea
    id: description
    attributes:
      label: Describe the feature / Descrivi la funzionalità
      description: What would you like to see and why? / Cosa vorresti e perché?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered / Alternative considerate
